[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow3d-dps"
version = "0.1.0"
description = "Unconditional flow priors and trajectory diffusion posterior sampling"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
